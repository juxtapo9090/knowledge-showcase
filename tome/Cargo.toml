[package]
name = "tome"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
md5 = "0.8.0"
rayon = "1.11.0"
rusqlite = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tantivy = "0.22.1"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
